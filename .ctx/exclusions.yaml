paths:
  - node_modules
  - dist
  - build
  - .git
  - "*.test.ts"
  - "*.spec.ts"
  - __mocks__
  - __tests__
  - coverage
  - .next
  - .nuxt
  - .dart_tool
  - .flutter-plugins
  - .flutter-plugins-dependencies
  - "*.g.dart"
  - "*.freezed.dart"
  - "*.gr.dart"
  - "*.config.dart"
  - "*.mocks.dart"
ignore_patterns:
  - generated files
  - vendored code
